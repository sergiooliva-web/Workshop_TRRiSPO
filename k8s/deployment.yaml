apiVersion: apps/v1
kind: Deployment
metadata:
  name: crypto-tool
  namespace: crypto-tool
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crypto-tool
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: crypto-tool
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: app
          image: sergeishikov/crypto_tool:1.0.0
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: crypto-tool-config
            - secretRef:
                name: crypto-tool-secret
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8081
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
